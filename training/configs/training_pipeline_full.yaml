raw_paths:
  - training/data/raw/2024-20250000_part_00-003.csv
  - training/data/raw/2024-20250001_part_00-001.csv
n_rows: 0              # 0 = load ALL rows via chunked reader
chunk_size: 2000000    # rows per chunk (~500 MB raw peak)
sample_position: tail  # ignored when n_rows=0
include_seasonality: true
interim_path: training/data/interim/orders_full.parquet
products_path: training/data/external/products_v2.csv
commerces_path: training/data/external/commerces.csv
model_path: training/models/lgbm_ranker_full.txt
train_ratio: 0.8
val_ratio: 0.1
test_ratio: 0.1
train_label_ratio: 0.3
min_cooc: 3
min_lift: 1.2
top_k: 100
top_k_train: 100
label_window_days: 7
min_cooc_label: 1
label_kiosk_batch_size: 0
max_neg_per_group: 20
max_train_queries: 200000  # limit train/val queries to fit in 8GB RAM
max_eval_queries: 50000
max_basket_items: 50     # cap basket size to limit O(n²) pair explosion
pair_batch_size: 100000  # orders per batch in self-join (memory-safe)
eval_ks: [5, 10, 20]
predict_batch_size: 200000
lgbm_params:
  learning_rate: 0.02
  num_leaves: 15
  max_depth: 5
  min_data_in_leaf: 1000
  min_gain_to_split: 0.5
  lambda_l1: 2.0
  lambda_l2: 10.0
  feature_fraction: 0.55
  bagging_fraction: 0.6
  bagging_freq: 1
  seed: 42
num_boost_round: 2000
early_stopping_rounds: 100
eval_log_path: logs/training_full_eval_curve.csv
